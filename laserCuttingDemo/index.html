<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laser Cutting Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    background: #1a1b2e;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  body::before {
    content: '';
    position: absolute;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(46, 204, 168, 0.18) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  h1 {
    position: relative;
    z-index: 1;
    color: #ffffff;
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    font-weight: 900;
    text-align: center;
    letter-spacing: -1px;
    text-shadow: 0 2px 20px rgba(46, 204, 168, 0.3);
  }

  h1 span { color: #2ecca8; }

  .layout {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
    padding: 0 16px;
  }

  .topics {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .topics li {
    position: relative;
    padding-left: 1.6rem;
    color: #e2e4f0;
    font-size: clamp(1.1rem, 2.4vw, 1.6rem);
    line-height: 1.35;
  }

  .topics li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.55em;
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: #2ecca8;
  }
</style>
</head>
<body>

<div class="layout">
  <h1>Laser Cutting <span>Demo</span></h1>

  <ul class="topics">
    <li>Laser sources / Material compatibility</li>
    <li>Material selection</li>
    <li>Operations and Settings</li>
    <li>Air extraction</li>
    <li>Framing</li>
    <li>Why is the shield important</li>
  </ul>
</div>

</body>
</html>
