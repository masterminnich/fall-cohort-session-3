<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Plan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at 50% 20%, #241a3d 0%, #120c24 55%, #08050f 100%);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* starfield */
  .stars, .stars2 {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-repeat: repeat;
    opacity: 0.7;
  }
  .stars {
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 120px 90px, #fff, transparent),
      radial-gradient(2px 2px at 250px 150px, #fff, transparent),
      radial-gradient(1px 1px at 340px 60px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 60px 200px, #fff, transparent),
      radial-gradient(1px 1px at 400px 300px, #fff, transparent);
    background-size: 420px 340px;
    animation: drift 60s linear infinite;
  }
  .stars2 {
    background-image:
      radial-gradient(1px 1px at 80px 120px, #ffd9f4, transparent),
      radial-gradient(1.5px 1.5px at 300px 40px, #d9e8ff, transparent),
      radial-gradient(1px 1px at 180px 260px, #fff5d9, transparent);
    background-size: 380px 380px;
    animation: drift 90s linear infinite reverse;
    opacity: 0.5;
  }
  @keyframes drift {
    from { background-position: 0 0; }
    to { background-position: -1000px 1000px; }
  }

  .glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 1100px; height: 1100px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(139, 92, 246, 0.20) 0%, transparent 65%);
    z-index: 0;
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.85; }
    50% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
  }

  .header {
    position: relative;
    z-index: 5;
    text-align: center;
    padding-top: 4.2vh;
  }

  .eyebrow {
    font-size: clamp(0.85rem, 1.4vw, 1.1rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #c9b8ff;
    font-weight: 700;
    opacity: 0.85;
  }

  .title {
    font-size: clamp(2.6rem, 6vw, 5rem);
    font-weight: 900;
    margin-top: 0.4vh;
    background: linear-gradient(90deg, #fff 0%, #e0d4ff 40%, #ffd9f4 70%, #fff 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
    text-shadow: 0 0 60px rgba(180, 140, 255, 0.35);
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    margin-top: 1vh;
    font-size: clamp(1rem, 1.6vw, 1.3rem);
    color: #cfc4ea;
    font-weight: 400;
    opacity: 0.9;
  }

  .stage {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .card {
    position: absolute;
    border-radius: 8px;
    overflow: hidden;
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.55),
      0 0 0 1px rgba(255, 255, 255, 0.08),
      0 0 40px rgba(168, 130, 255, 0.25);
    animation: float 7s ease-in-out infinite, fadein 1.2s ease both;
  }

  .card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 8px;
    box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.06);
    pointer-events: none;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(40px) scale(0.9); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(var(--rot)); }
    50% { transform: translateY(-22px) rotate(var(--rot)); }
  }

  .c1 { top: 16vh; left: 6vw;  width: 13vw; min-width: 150px; --rot: -9deg; animation-delay: 0s, 0s; }
  .c2 { top: 24vh; left: 19vw; width: 11.5vw; min-width: 135px; --rot: 6deg; animation-delay: 0.6s, 0.15s; }
  .c3 { top: 40vh; left: 4vw;  width: 12vw; min-width: 140px; --rot: 11deg; animation-delay: 1.1s, 0.4s; }
  .c4 { top: 14vh; right: 6vw; width: 13vw; min-width: 150px; --rot: 8deg; animation-delay: 0.3s, 0.25s; }
  .c5 { top: 24vh; right: 19vw; width: 11.3vw; min-width: 135px; --rot: -7deg; animation-delay: 0.9s, 0.5s; }
  .c6 { top: 40vh; right: 4vw; width: 12vw; min-width: 140px; --rot: -12deg; animation-delay: 1.4s, 0.6s; }

  /* sparkles */
  .sparkle {
    position: absolute;
    z-index: 3;
    color: #ffe9ff;
    opacity: 0;
    font-size: 1.4rem;
    animation: sparkle 3.2s ease-in-out infinite;
    text-shadow: 0 0 8px #fff, 0 0 16px #c9a6ff;
  }
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.15) rotate(90deg); }
  }

  .bullets {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    display: flex;
    flex-direction: column;
    gap: 3.2vh;
    text-align: center;
  }

  .bullets div {
    font-size: clamp(1rem, 1.9vw, 1.5rem);
    font-weight: 700;
    color: #f2ecff;
    letter-spacing: 0.02em;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 130, 255, 0.35);
    white-space: nowrap;
  }

  .footer-line {
    position: absolute;
    bottom: 4.5vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    text-align: center;
    font-size: clamp(0.95rem, 1.5vw, 1.2rem);
    color: #e7ddff;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .footer-line span {
    color: #ffd9f4;
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="stars2"></div>
<div class="glow"></div>

<div class="header">
  <div class="eyebrow">Today's Plan</div>
  <div class="title">AI &amp; Lasers</div>
</div>

<div class="stage">
  <div class="card c1"><img src="card-strategist.jpg" alt=""></div>
  <div class="card c2"><img src="card-connector.jpg" alt=""></div>
  <div class="card c3"><img src="card-rescuer.jpg" alt=""></div>
  <div class="card c4"><img src="card-builder.jpg" alt=""></div>
  <div class="card c5"><img src="card-makerspace.jpg" alt=""></div>
  <div class="card c6"><img src="card-artist.jpg" alt=""></div>

  <div class="sparkle" style="top: 10vh; left: 19vw; animation-delay: 0.2s;">&#10022;</div>
  <div class="sparkle" style="top: 34vh; left: 18vw; animation-delay: 1.4s;">&#10022;</div>
  <div class="sparkle" style="top: 60vh; left: 9vw; animation-delay: 2.1s;">&#10022;</div>
  <div class="sparkle" style="top: 9vh; right: 19vw; animation-delay: 0.8s;">&#10022;</div>
  <div class="sparkle" style="top: 33vh; right: 18vw; animation-delay: 1.9s;">&#10022;</div>
  <div class="sparkle" style="top: 58vh; right: 9vw; animation-delay: 0.5s;">&#10022;</div>
  <div class="sparkle" style="top: 47vh; left: 45vw; font-size: 1rem; animation-delay: 1.1s;">&#10022;</div>
  <div class="sparkle" style="top: 52vh; right: 44vw; font-size: 1rem; animation-delay: 2.4s;">&#10022;</div>

  <div class="bullets">
    <div>Fabricate your STHS Trading Card</div>
    <div>Laser Exploration Activity</div>
  </div>
</div>


</body>
</html>
